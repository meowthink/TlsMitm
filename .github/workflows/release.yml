name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish TlsMitm -c Release -r win-x64 --self-contained -o out/publish

      - name: Zip
        run: |
          $zip = "out/TlsMitm-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path out/publish/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Release
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" --title "$env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
